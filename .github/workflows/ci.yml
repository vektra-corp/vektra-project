name: CI

on:
  pull_request:
  # Callable from deploy.yml, which runs these checks before it ships anything.
  # There is deliberately no `push` trigger: deploy.yml already fires on pushes
  # to main and develop and calls this, and a second trigger would run the whole
  # suite twice for every merge.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Local Supabase defaults; no real secret is ever needed for CI.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_ADMIN_URL: http://localhost:3001

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Check translation completeness
        run: pnpm i18n:check

      - name: Build
        run: pnpm build
        env:
          # Build-time placeholders. Real values come from Vercel per environment.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder

  rls:
    name: RLS isolation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.116.0

      # Applies every migration and then seed.sql, which builds the two-tenant
      # fixture the isolation tests assert against.
      - name: Start Supabase
        run: supabase start

      - name: RLS isolation tests
        run: pnpm test:rls
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # A migration that changes the schema without regenerating types is a
      # silent way for the app and the database to drift apart.
      - name: Database types are up to date
        run: |
          supabase gen types typescript --local > /tmp/types.ts
          if ! diff -q /tmp/types.ts packages/db/src/types.ts >/dev/null; then
            echo "::error::packages/db/src/types.ts is stale. Run 'pnpm db:types' and commit the result."
            diff -u packages/db/src/types.ts /tmp/types.ts | head -50
            exit 1
          fi

      - name: Stop Supabase
        if: always()
        run: supabase stop

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.116.0

      # Same fixture the RLS suite uses: every migration, then seed.sql.
      - name: Start Supabase
        run: supabase start

      # Only the browser the suite actually uses. --with-deps because the GitHub
      # runner has none of Chromium's shared libraries.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Read from the running stack rather than hard-coded. The keys a local
      # Supabase issues are not secret, but they do change between CLI versions,
      # and a stale literal would fail as an opaque auth error.
      - name: Export local Supabase keys
        run: |
          supabase status -o env | tr -d '"' > /tmp/supabase.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' /tmp/supabase.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' /tmp/supabase.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' /tmp/supabase.env | cut -d= -f2-)" >> "$GITHUB_ENV"

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          CI: 'true'

      # The trace is the whole point of a failed run: it replays the browser.
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # §13.11: weekly automated dependency scan. Fails the build on a
      # high-severity advisory.
      - name: Audit dependencies
        run: pnpm audit --audit-level high
